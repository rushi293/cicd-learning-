name: CI/CD

on:
  push:

jobs:

  # =========================
  # CI
  # =========================
  test:
    runs-on: self-hosted

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show environment
        env:
          ENVIRONMENT: CI
        run: echo "Running in $ENVIRONMENT"

      - name: Use secret
        env:
          DEMO_SECRET: ${{ secrets.CI_DEMO_SECRET }}
        run: echo "Secret is configured"

      - name: Run tests
        run: ./test.sh

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ghcr.io/rushi293/cicd-learning:1.0 .

      - name: Push Docker image
        run: docker push ghcr.io/rushi293/cicd-learning:1.0


  # =========================
  # CD
  # =========================
  deploy:
    needs: test
    runs-on: self-hosted

    permissions:
      contents: read
      packages: read

    steps:

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker image
        run: docker pull ghcr.io/rushi293/cicd-learning:1.0

      - name: Stop old container
        run: docker rm -f cicd-deployment || true

      - name: Start new container
        run: docker run -d --name cicd-deployment ghcr.io/rushi293/cicd-learning:1.0

      - name: Check deployment
        run: docker ps --filter name=cicd-deployment
