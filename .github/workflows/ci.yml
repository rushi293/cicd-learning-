name: CI

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show environment
        env:
          ENVIRONMENT: CI
        run: echo "Running in $ENVIRONMENT"

      - name: Use secret
        env:
          DEMO_SECRET: ${{ secrets.CI_DEMO_SECRET }}
        run: echo "Secret is configured $DEMO_SECRET"

      - name: Run test
        run: ./test.sh

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ghcr.io/rushi293/cicd-learning:1.0 .

      - name: Push Docker image
        run: docker push ghcr.io/rushi293/cicd-learning:1.0
